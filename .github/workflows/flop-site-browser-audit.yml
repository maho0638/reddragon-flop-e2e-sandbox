name: FLOP isolated Chromium E2E
on:
  push:
    branches:
      - qa/flop-e2e-9bbc626
    paths:
      - .github/workflows/flop-site-browser-audit.yml
      - api/flop-status.js
      - api/relay.js
      - package.json
      - public/app.js
      - public/final-fixes.js
      - public/flop-live-status.js
      - public/flop-source-status.json
      - public/flop.html
      - public/language-stable.js
      - public/llms.txt
      - public/styles.css
      - scripts/browser/flop-ui.spec.mjs
      - scripts/browser/site-acceptance.spec.mjs
      - scripts/flop-status.test.mjs
      - scripts/local-preview-http-smoke.mjs
      - scripts/local-preview-server.mjs
      - scripts/relay-security-audit.test.mjs
      - scripts/relay.test.mjs
      - scripts/ui-i18n.test.mjs
      - scripts/verify-flop-observatory.test.mjs
  workflow_dispatch:
    inputs:
      run_production_acceptance:
        description: "Safety lock: keep false; production acceptance is not run"
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: flop-e2e-9bbc626
  cancel-in-progress: false
jobs:
  local-browser-e2e:
    if: ${{ github.ref == 'refs/heads/qa/flop-e2e-9bbc626' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_production_acceptance == false)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false
