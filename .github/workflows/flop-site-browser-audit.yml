name: FLOP isolated Chromium E2E

on:
  push:
    branches:
      - qa/flop-e2e-54354b1
    paths:
      - ".github/workflows/flop-site-browser-audit.yml"
      - "api/**"
      - "package.json"
      - "public/**"
      - "scripts/**"
permissions:
  contents: read
concurrency:
  group: flop-e2e-54354b1
  cancel-in-progress: false
jobs:
  isolated-browser-e2e:
    if: ${{ github.ref == 'refs/heads/qa/flop-e2e-54354b1' && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify SHA-256 source manifest
        run: |
          echo "SOURCE_RECONSTRUCTION=from-private-development-checkpoints"
          echo "SANDBOX_TEST_CANDIDATE=$(git rev-parse HEAD)"
          sha256sum --check .github/source-sha256.txt
      - name: Run unit and security regressions
        run: npm test
      - name: Install pinned Playwright package
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.65.1
      - name: Install ephemeral Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify local preview denies relay writes
        run: npm run test:local-preview
      - name: Run loopback-only Chromium E2E with mock relay
        run: npm run test:browser
