name: FLOP production read-only Chromium audit
on:
  push:
    branches:
      - qa/flop-e2e-9bbc626
    paths:
      - .github/workflows/production-readonly-audit.yml
permissions:
  contents: read
concurrency:
  group: flop-production-readonly-audit
  cancel-in-progress: false
jobs:
  production-read-only-audit:
    if: ${{ github.ref == 'refs/heads/qa/flop-e2e-9bbc626' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify read-only audit source hashes
        run: |
          sha256sum --check <<'SHA256'
          bfa006337676118ec817e2850f64070dcea271d21170b130d8a329be5592a916  scripts/browser/production-readonly-audit.mjs
          ff86986e6b043e07fb10eefde15075a7d59811e0dd7886a8d61d4b80d8932ee1  scripts/browser/csp-violation-gate.mjs
          SHA256
      - name: Install pinned Playwright runtime
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.65.1
      - name: Install Chromium on temporary runner
        id: install_chromium
        run: npx playwright install --with-deps chromium
      - name: Run production UI and responsive audit (relay writes intercepted)
        run: node scripts/browser/production-readonly-audit.mjs
        env:
          SITE_ACCEPTANCE_ORIGIN: https://reddragon-technocore.vercel.app
      - name: Fail on production CSP, browser, network or write signals
        if: ${{ always() && steps.install_chromium.outcome == 'success' }}
        run: node scripts/browser/csp-violation-gate.mjs
        env:
          SITE_ACCEPTANCE_ORIGIN: https://reddragon-technocore.vercel.app
